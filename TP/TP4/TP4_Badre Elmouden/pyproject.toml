# Fiche d'identité du package maintai : lue par pip install et par python -m build
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai"
dynamic = ["version"]  # lue dans maintai/__init__.py (voir plus bas)
description = "Prédiction de panne de machines à partir de relevés de capteurs (modèle, API, client et commande maintai-predict)"
readme = "README.md"
requires-python = ">=3.11"
# Ce que le code de maintai/ importe pour fonctionner, avec une version minimale (>=)
#   numpy : dataset.py ; pandas : dataset.py, data.py, predict.py
#   scikit-learn : data.py, train.py ; joblib : train.py, predict.py ; httpx : client.py
# pytest, ruff, fastapi, uvicorn, streamlit sont dans les groupes optionnels ci-dessous
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff"]

# La commande maintai-predict appelle la fonction main de maintai/cli.py
# (pip crée maintai-predict.exe dans .venv\Scripts à l'installation)
[project.scripts]
maintai-predict = "maintai.cli:main"

[tool.setuptools.dynamic]
version = {attr = "maintai.__version__"}

[tool.setuptools.packages.find]
include = ["maintai*"]  # seul le dossier maintai/ entre dans le package
